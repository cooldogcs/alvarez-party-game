<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102f2b"><title>GameBox | Family Game Night</title><link rel="stylesheet" href="styles.css"><style>#game-view{position:fixed;inset:0;z-index:100;background:#102f2b;display:flex;flex-direction:column}#game-view.hidden{display:none}#game-view nav{padding:8px 16px;background:#102f2b}#game-view button{border:1px solid #edc575;background:#163d36;color:#fff;padding:9px 16px;border-radius:10px;font:inherit}#game-frame{border:0;width:100%;flex:1;min-height:0}.gamebox-controls{margin-top:20px}.gamebox-controls button{border:1px solid #edc575;background:#163d36;color:#fff;padding:12px 20px;border-radius:12px;font:inherit;cursor:pointer}.gamebox-controls button:focus-visible{outline:3px solid #edc575;outline-offset:4px}#fullscreenStatus{font-size:.9rem}</style><link rel="stylesheet" href="settings.css"></head><body>  <section id="gamebox-home" class="gamebox-home" aria-labelledby="gamebox-title">
    <header class="gamebox-heading"><span class="gamebox-kicker">FAMILY GAME NIGHT</span><h1 id="gamebox-title">Game<span>Box</span></h1><p>Your favourite people. A table full of games.</p></header>
    <main class="gamebox-library"><div class="gamebox-section-title"><h2>Choose your game</h2><span>1 game available</span></div>
      <div id="gamebox-games" class="gamebox-grid"></div>
      <aside class="gamebox-coming"><span aria-hidden="true">✦</span><div><h3>There’s room for more</h3><p>More card games, dice games and family favourites can join the box.</p></div></aside>
    </main><footer>Gather round. Pick a game. Let’s play.</footer>
  </section>
<section id="game-view" class="hidden"><iframe id="game-frame" title="¡ALDELIR! Family Party Game" allow="fullscreen; autoplay" allowfullscreen></iframe></section><button id="settings-open" class="settings-launch" type="button" aria-controls="settings-drawer" aria-expanded="false" aria-label="Open settings">⚙ <span>Settings</span></button>
<div id="settings-backdrop" hidden></div>
<aside id="settings-drawer" role="dialog" aria-modal="true" aria-labelledby="settings-title" inert>
<header><h2 id="settings-title">Settings</h2><button id="settings-close" type="button" aria-label="Close settings">✕</button></header>
<p class="settings-caption">GameBox</p>
<button id="fullscreenToggle" type="button" aria-pressed="false" aria-label="Enter full screen">⛶ <span>Full screen</span></button>
<p id="fullscreenStatus" class="hidden" role="status"></p>
<section id="game-settings" hidden><h3>Game settings</h3><div id="game-settings-controls"></div><p id="game-settings-status" role="status"></p></section>
<button id="home-button" type="button" hidden>‹ Back to main menu</button>
</aside>
<script src="fullscreen.js"></script><script src="gamebox.js"></script><script src="settings.js"></script></body></html>
